# Gesture tuning. Edit, save, restart the bridge. No re-flash, no command-line flags.
# This file is tracked in git, so changes reach every client.
# Connection settings (transport, sinks, USB port, BLE address, websocket port) are in
# bridge/config.toml, used with: python -m wefit_bridge --config bridge/config.toml
#
# The bridge reads this file every time it starts and logs which profile it used:
#   --transport usb  -> [usb]
#   --transport ble  -> [ble]
#   --transport fake -> ignores this file (built-in defaults)
# A setting you delete falls back to the built-in default. A misspelt setting is an
# error, not a silent no-op.

# =================================================================================
# SENSOR MODE. Which sensors the motion chip combines.
#
#   "imu"   accelerometer + gyroscope. The default. Startup skips the NDOF checks.
#   "ndof"  the same plus the magnetometer (compass). Startup also checks calibration
#           and the magnetic field around the controller.
#
# Order of authority:
#   1. the --gravity flag always uses "ndof" and ignores this setting
#   2. otherwise this setting
#   3. if this line is deleted: "imu"
# =================================================================================
fusion_mode = "imu"

# ---------------------------------------------------------------------------------
# Orientation: which way the sensor is mounted. Shared by USB and Bluetooth.
# Not used with --gravity, which works the directions out by itself.
#
# Name the sensor axis that points to the player's RIGHT and the one that points UP.
# Valid values: "+x" "-x" "+y" "-y" "+z" "-z". The two must be on different axes.
#
#   left/right swapped        -> flip the sign of `right`   ("+x" -> "-x")
#   up/down swapped           -> flip the sign of `up`      ("+z" -> "-z")
#   a jump reads as a sidestep -> the axes are swapped; exchange the two letters
#
# To find the axes: run `pio device monitor -d firmware -b 115200` and watch the
# `S,<seq>,<t_ms>,<ax>,<ay>,<az>,...` lines while you push the controller right, then
# up. See which of ax, ay, az jumps, and with which sign.
# ---------------------------------------------------------------------------------
[orientation]
right = "+x"
up    = "+z"

# ---------------------------------------------------------------------------------
# One profile per connection, one row per direction.
#
# threshold    m/s^2, greater than 0. Acceleration needed to count as a gesture.
#              Lower = more sensitive (and more false triggers). Typical 3 to 12.
#              Keep it above rest_threshold.
# rest_ms      ms, 0 or more. How long that axis (left/right or up/down) must be still
#              before this direction can fire. This is what stops the jolt at the end
#              of a jump from reading as a duck. Too low = phantom opposite gestures;
#              too high = quick up-then-down is missed. 0 turns the check off.
# cooldown_ms  ms, 0 or more. Minimum time between two gestures in this same
#              direction. Lower = faster repeats. 0 turns the check off.
#
# rest_threshold  m/s^2, greater than 0. An axis below this counts as "still".
#                 Raise it if a shaky hand never re-arms; typical 0.5 to 2.
#
# A gesture on the other axis is never delayed: up then left fires straight away.
# ---------------------------------------------------------------------------------

[usb]   # wired
rest_threshold = 1.0
up    = { threshold = 7.0, rest_ms = 150, cooldown_ms = 500 }
down  = { threshold = 4.0, rest_ms = 150, cooldown_ms = 500 }
left  = { threshold = 4.0, rest_ms = 150, cooldown_ms = 500 }
right = { threshold = 4.0, rest_ms = 150, cooldown_ms = 500 }

[ble]   # Bluetooth
rest_threshold = 1.0
up    = { threshold = 17.0, rest_ms = 150, cooldown_ms = 100 }
down  = { threshold = 9.0, rest_ms = 150, cooldown_ms = 300 }
left  = { threshold = 5.0, rest_ms = 100, cooldown_ms = 30 }
right = { threshold = 5.0, rest_ms = 100, cooldown_ms = 30 }

# ---------------------------------------------------------------------------------
# Ground-referenced mode (--gravity) and the NDOF startup checks.
#
# mag_min_ut / mag_max_ut   microtesla. Field strength outside this range prints a
#                           warning at startup and is logged during play. Earth's field
#                           is 25 to 65; a magnet or speaker nearby reads far higher.
# still_ms2                 m/s^2. Below this the controller counts as held still.
# reference_timeout_s       seconds to wait for the "shuffle right" at startup.
# ---------------------------------------------------------------------------------
[gravity]
mag_min_ut = 20
mag_max_ut = 80
still_ms2 = 0.5
reference_timeout_s = 10

# ---------------------------------------------------------------------------------
# The browser game. Sent to the game page each time it connects to the bridge, so
# edit, save, restart the bridge, and the page picks it up when it reconnects (no
# page reload). With --transport fake this file is ignored and the default (150) is
# sent. Keyboard-only play, with no bridge, uses the game's built-in default (150).
#
# jump_buffer_ms  ms, 0 to 1000. A jump pressed up to this long before you land is
#                 remembered and runs the moment you touch down. Higher = more
#                 forgiving of early jumps, but a jump you did not mean can fire on
#                 landing. 0 turns the buffer off. Typical 100 to 200.
# ---------------------------------------------------------------------------------
[game]
jump_buffer_ms = 150

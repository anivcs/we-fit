; WeFit controller firmware: ESP32 + BNO055, streams IMU samples over BLE.
; Wire format is defined in .claude/docs/protocol.md and include/protocol.h.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit BNO055@^1.6.3
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/Adafruit BusIO@^1.16.1
; The built-in BLE stack is large. If the build overflows the app partition:
; board_build.partitions = huge_app.csv

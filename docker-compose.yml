services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wefit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wefit}
      POSTGRES_DB: ${POSTGRES_DB:-wefit}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Exposed on localhost only, for debugging with psql/GUI tools.
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-wefit}:${POSTGRES_PASSWORD:-wefit}@db:5432/${POSTGRES_DB:-wefit}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
